<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sasha's Friday in Rome</title>
<meta name="robots" content="noindex">
<meta name="description" content="You land at 08:10. The rest is up to you :)">
<meta name="theme-color" content="#CFE4F1">
<meta property="og:type" content="website">
<meta property="og:title" content="Sasha's Friday in Rome">
<meta property="og:description" content="You land at 08:10. The rest is up to you :)">
<meta property="og:image" content="https://whaamkabaam.github.io/venerdi/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An arrivals split-flap board above the word Friday">
<meta property="og:url" content="https://whaamkabaam.github.io/venerdi/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sasha's Friday in Rome">
<meta name="twitter:description" content="You land at 08:10. The rest is up to you :)">
<meta name="twitter:image" content="https://whaamkabaam.github.io/venerdi/og.jpg">
<meta name="twitter:image:alt" content="An arrivals split-flap board above the word Friday">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* Preload the two critical fonts. Skipped on file://, where a crossorigin preload only logs CORS errors. */
  if (location.protocol !== 'file:') ['bodoni-moda-latin-opsz-normal', 'archivo-latin-wdth-normal'].forEach(function (f) {
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = 'fonts/' + f + '.woff2';
    document.head.appendChild(l);
  });
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sky-bg" aria-hidden="true"></div>
<aside class="hud" data-slot="hud">
  <div class="hud-inner">
    <div class="hud-clock" aria-hidden="true"></div>
    <p class="hud-place"><span class="sr-only" data-slot="hud-time"></span><span data-slot="hud-place"></span></p>
    <div class="hud-legs">
      <p class="hud-km" data-slot="hud-km"></p>
      <span class="hud-bar" aria-hidden="true"><span class="hud-fill"></span></span>
    </div>
    <button class="btn btn--small hud-now" type="button" hidden><span class="now-long" data-slot="now-long"></span><span class="now-short" data-slot="now-short"></span></button>
  </div>
</aside>

<header class="hero" id="top">
  <div class="board-wrap" data-slot="board"></div>
  <h1 class="sr-only" data-slot="hero-title"></h1>
  <noscript><p class="noscript">This page needs JavaScript.</p></noscript>
</header>

<main>
  <section class="section" id="note" aria-labelledby="note-h">
    <h2 id="note-h" class="sr-only" data-slot="note-title"></h2>
    <div class="note" data-slot="note"></div>
  </section>

  <section class="section section--ask" id="ask" aria-labelledby="ask-h">
    <h2 id="ask-h" class="sr-only" data-slot="ask-title"></h2>
    <div class="stage" data-slot="stage"></div>
  </section>

  <!-- The board, the day, send and the map stay hidden (and the board unbuilt) until she has planned. -->
  <section class="section section--dep" id="dep" aria-labelledby="dep-h" hidden>
    <h2 id="dep-h" class="sr-only" data-slot="dep-title"></h2>
    <div data-slot="dep-note"></div>
    <div class="board-wrap" data-slot="dep-board"></div>
  </section>

  <section class="section section--day" id="day" aria-labelledby="day-h" hidden>
    <div class="day-head">
      <h2 id="day-h" data-slot="day-title"></h2>
      <button class="day-change" type="button" data-slot="change-answers"></button>
    </div>
    <p class="day-parked" data-slot="day-parked" hidden></p>
    <p class="day-weather" data-slot="weather" hidden></p>
    <div class="day-map" data-slot="day-map"></div>
    <div class="day-body" data-slot="day-body"></div>
    <dialog class="sheet catalogue" data-slot="catalogue" aria-labelledby="cat-h"></dialog>
  </section>

  <section class="section section--send" id="send" aria-labelledby="free-label" hidden>
    <div class="send">
      <label class="send-label" id="free-label" for="free-text" data-slot="free-label"></label>
      <textarea id="free-text" class="send-text" rows="2" maxlength="1000" data-slot="free-text"></textarea>
      <button class="btn btn--primary send-btn" type="button" data-slot="send"></button>
      <div class="send-after" data-slot="send-after"></div>
    </div>
  </section>

  <section class="section" id="map" aria-labelledby="map-h" hidden>
    <h2 id="map-h" data-slot="map-title"></h2>
    <div data-slot="map-home"></div>
  </section>

</main>

<footer class="footer">
  <p><a class="footer-credits" href="credits.html" data-slot="credits"></a></p>
</footer>

<!-- The peek: what's in a choice, in photos (one dialog for every use). -->
<dialog class="sheet peek" data-slot="peek" aria-labelledby="peek-h"></dialog>

<script src="data.js"></script>
<script src="plan.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="vendor/web-haptics.js"></script>
<script src="app.js"></script>
</body>
</html>
