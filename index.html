<script>
  /* Preload the critical fonts (both display subsets are on the first screen). Skipped on file://, where a crossorigin preload only logs CORS errors. */
  if (location.protocol !== 'file:') ['michelangelus-bold', 'michelangelus-italic', 'archivo-latin-wdth-normal'].forEach(function (f) {
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = 'fonts/' + f + '.woff2';
    document.head.appendChild(l);
  });
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sky-bg" aria-hidden="true"></div>
<aside class="hud" data-slot="hud">
  <div class="hud-inner">
    <span class="hapw hapw--clock"><button class="hud-clock" type="button" data-slot="hud-clock"></button><label class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label></span>
    <p class="hud-place"><span class="sr-only" data-slot="hud-time"></span><span data-slot="hud-place"></span></p>
    <span class="hapw hapw--now" hidden><button class="btn btn--small hud-now" type="button" hidden><span class="now-long" data-slot="now-long"></span><span class="now-short" data-slot="now-short"></span></button><label class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label></span>
    <span class="hapw hapw--pocket" hidden><button class="hud-map" type="button" data-slot="hud-map" aria-haspopup="dialog" hidden></button><label class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label></span>
  </div>
</aside>

<header class="hero" id="top">
  <div class="hero-grid">
    <div class="board-wrap" data-slot="board"></div>
    <section class="hero-note" id="note" aria-labelledby="note-h">
      <h2 id="note-h" class="sr-only" data-slot="note-title"></h2>
      <div class="note" data-slot="note"></div>
    </section>
  </div>
  <h1 class="sr-only" data-slot="hero-title"></h1>
  <noscript><p class="noscript">This page needs JavaScript.</p></noscript>
</header>

<main>
  <section class="section section--ask" id="ask" aria-labelledby="ask-h">
    <h2 id="ask-h" class="sr-only" data-slot="ask-title"></h2>
    <div class="stage" data-slot="stage"></div>
  </section>

  <!-- The board, the day and send stay hidden (and the board unbuilt) until she has planned. -->
  <section class="section section--dep" id="dep" aria-labelledby="dep-h" hidden>
    <h2 id="dep-h" class="sr-only" data-slot="dep-title"></h2>
    <div data-slot="dep-note"></div>
    <div class="board-wrap" data-slot="dep-board"></div>
    <p class="dep-weather" data-slot="weather" hidden></p>
  </section>

  <section class="section section--day" id="day" aria-labelledby="day-h" hidden>
    <div class="day-head">
      <h2 id="day-h" data-slot="day-title"></h2>
      <span class="hapw hapw--change"><button class="day-change" type="button" data-slot="change-answers"></button><label class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label></span>
    </div>
    <div class="day-lines" data-slot="day-lines" hidden></div>
    <p id="day-live" class="sr-only" aria-live="polite"></p>
    <div class="day-map" data-slot="day-map"></div>
    <p id="map-credit" class="sr-only" data-slot="map-credit"></p>
    <div class="day-body" data-slot="day-body"></div>
    <dialog class="sheet catalogue" data-slot="catalogue" aria-labelledby="cat-h"></dialog>
    <!-- Send closes the day's column inside #day, so the laptop's sticky map holds beside it to the end. -->
    <section class="section section--send" id="send" aria-labelledby="free-label" hidden>
      <div class="send">
        <label class="send-label" id="free-label" for="free-text" data-slot="free-label"></label>
        <textarea id="free-text" class="send-text" rows="2" maxlength="1000" data-slot="free-text"></textarea>
        <div class="send-bar"><span class="picked" aria-hidden="true" data-slot="send-picked"></span><span class="hapw hapw--send"><button class="btn btn--primary send-btn" type="button" data-slot="send"></button><label class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label></span></div>
      </div>
    </section>
  </section>

</main>

<div class="footer"></div>

<!-- The peek: what's in a choice, in photos (one dialog for every use). -->
<dialog class="sheet peek" data-slot="peek" aria-labelledby="peek-h"></dialog>
<!-- The whole map on a phone: the pocket map in the bar opens it. -->
<dialog class="sheet mapsheet" data-slot="mapsheet" aria-labelledby="ms-h"></dialog>

<script src="data.js"></script>
<script src="plan.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="app.js"></script>
<script>
  /* Cloudflare Web Analytics (no cookies, so no banner), on the live site only: a local copy or a preview counts no visit. */
  if (location.hostname === 'whaamkabaam.github.io') {
    var cf = document.createElement('script');
    cf.type = 'module'; cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    cf.setAttribute('data-cf-beacon', '{"token": "5e68ce1bab7542d48d91859ebb74e345"}');
    document.body.appendChild(cf);
    /* Felix 14 Oct: tell the phones apart. Each browser keeps a random code; a hidden frame opens seen.html with it,
       which Cloudflare files under /venerdi/seen/<code>/, so this phone's visits have their own line. Nothing else is sent. */
    var code = null;
    try { code = localStorage.getItem('venerdi:v8:device'); } catch (e) { /* storage blocked: a one-off code below */ }
    if (!/^[a-z0-9]{8}$/.test(code || '')) {
      code = Array.from(crypto.getRandomValues(new Uint8Array(8)), function (b) { return (b % 36).toString(36); }).join('');
      try { localStorage.setItem('venerdi:v8:device', code); } catch (e) { /* counted once, as a new phone */ }
    }
    addEventListener('load', function () {
      var seen = document.createElement('iframe');
      seen.src = '/venerdi/seen.html?d=' + code; seen.hidden = true; seen.tabIndex = -1; seen.title = '';
      seen.setAttribute('aria-hidden', 'true');
      document.body.appendChild(seen);
    });
  }
</script>
</body>
</html>
